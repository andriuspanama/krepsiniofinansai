<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--a:#ffb400;--b:#0ea5e9;--sv:#64748b;--pos:#12a150;--neg:#e5254b;--sh:0 1px 2px rgba(15,23,42,.06),0 14px 34px -14px rgba(15,23,42,.25);--hd:'Barlow Condensed','Arial Narrow',sans-serif;--tx:'Source Sans 3',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0a1020;--card:#131c30;--ink:#f1f5f9;--mute:#9aa8bf;--line:#223052;--a:#ffc82e;--b:#38bdf8;--sv:#d7dee9;--pos:#34e39a;--neg:#ff6b86;--sh:0 1px 2px #0008,0 16px 36px -14px #000c}}
:root[data-t=dark]{--bg:#0a1020;--card:#131c30;--ink:#f1f5f9;--mute:#9aa8bf;--line:#223052;--a:#ffc82e;--b:#38bdf8;--sv:#d7dee9;--pos:#34e39a;--neg:#ff6b86;--sh:0 1px 2px #0008,0 16px 36px -14px #000c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--tx)}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:18px 20px 0;max-width:1200px;margin:auto}
h1{font:700 34px/1 var(--hd);margin:0;letter-spacing:.01em}
#st{color:var(--mute);font-size:14px;margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.ic{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-left:8px}
nav{display:flex;gap:4px;padding:14px 20px 0;max-width:1200px;margin:auto;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:700 20px var(--hd);padding:6px 12px;color:var(--mute);white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--a)}
main{max-width:1200px;margin:auto;padding:16px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:200px;margin-left:auto}
.sum{color:var(--mute);font-size:14px;margin:0 0 10px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 16px var(--hd);color:var(--mute);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th.l,td.l{text-align:left}
th[aria-sort]{color:var(--ink)}
td.l{position:sticky;left:0;background:var(--card)}
td small{display:block;color:var(--mute);font-size:12px;line-height:1.1}
tr:last-child td{border-bottom:0}
.sh{display:inline-flex;align-items:center;gap:8px}
.sh i{display:inline-block;width:70px;height:8px;background:var(--b);border-radius:2px;overflow:hidden;opacity:.9}
.sh i b{display:block;height:100%;background:var(--a)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.na{color:var(--mute)}
td a{margin-right:6px;color:var(--b)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{font:700 22px var(--hd);margin:0 0 6px}.card h3 span{color:var(--mute);font-size:16px;margin-left:6px}
.card p{margin:0 0 8px;font-size:15px}
.msg{background:var(--card);border:1px solid var(--neg);border-radius:8px;padding:16px;line-height:1.6}
tr.c,tr.pc{cursor:pointer}tr.c:hover td,tr.pc:hover td{background:color-mix(in srgb,var(--a) 12%,var(--card))}
.cl{display:flex;align-items:center}.lw{display:inline-grid;margin-right:10px;flex:none}.lw>*{grid-area:1/1;margin:0}
.lg{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff}.in{display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 12px var(--hd)}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}#md.o{display:flex}
.sheet{background:var(--bg);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 20px 28px}
@media(min-width:800px){#md{align-items:center}.sheet{border-radius:14px}}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.kp small{display:block;color:var(--mute);font-size:12px}.kp b{font:700 24px var(--hd)}
h2,h3{font-family:var(--hd);margin:8px 0 4px}h2{font-size:30px;margin:0}.top{display:flex;gap:8px;margin-bottom:10px}.top button{margin-left:auto}
.top button,.lk{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;color:var(--ink);text-decoration:none;font-size:14px}
iframe{width:100%;height:calc(100vh - 150px);min-height:620px;border:1px solid var(--line);border-radius:8px;background:#fff}
#lang{display:flex;gap:6px}.pf{position:relative;cursor:help;border-bottom:1px dotted var(--mute)}.tip{display:none;position:absolute;left:0;top:140%;z-index:5;width:min(380px,80vw);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px #0005}.pf:hover .tip,.pf:focus .tip{display:block}
body{background:radial-gradient(900px 380px at 85% -8%,color-mix(in srgb,var(--a) 16%,transparent),transparent),radial-gradient(700px 320px at -5% 0,color-mix(in srgb,var(--b) 12%,transparent),transparent),var(--bg);background-attachment:fixed}
.tw,.kp div,.card,.sheet,.chip{box-shadow:var(--sh)}.chip{border-radius:99px}.chip[aria-pressed=true]{background:linear-gradient(135deg,var(--a),#ff8a00);color:#1b1300;border-color:transparent;font-weight:700}
.pos,.neg{display:inline-block;padding:1px 10px;border-radius:99px;font-weight:700}.pos{color:var(--pos);background:color-mix(in srgb,var(--pos) 18%,transparent)}.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 18%,transparent)}
.sh i{background:color-mix(in srgb,var(--b) 28%,transparent);height:9px;border-radius:9px}.sh i b{background:linear-gradient(90deg,#ffd54a,#ff8a00);border-radius:9px}
.kp b{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 55%,var(--b)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.kp b .pos,.kp b .neg{-webkit-text-fill-color:currentColor}
#th{font-size:18px;padding:2px 9px}.rl{height:44px;max-width:130px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;box-shadow:var(--sh)}
.sx{position:relative;display:inline-block;margin-bottom:8px}.sx .opts{display:none;position:absolute;left:0;top:calc(100% - 2px);z-index:6;padding:10px;gap:6px;flex-wrap:wrap;width:min(430px,88vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}.sx:hover .opts,.sx:focus-within .opts{display:flex}
.ms{display:none;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;width:100%}
@media(max-width:720px){
 header{padding:14px 14px 0}h1{font-size:28px}#st{margin-left:0;width:100%}main{padding:12px 12px 60px}nav{padding:10px 12px 0}
 .bar{gap:6px}.bar.n{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.bar.n .chip{white-space:nowrap;flex:none}input[type=search]{width:100%;margin:0}
 .ms{display:block}.sum{font-size:13px}
 .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
 .tw table,.tw tbody,.tw tr,.tw td{display:block}.tw thead{display:none}
 .tw tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
 .tw td{border:0;padding:0;text-align:left;white-space:normal;position:static;background:transparent}
 .tw td.l{grid-column:1/-1;font-size:18px}.tw td.l small{display:block;margin-bottom:2px}
 .tw td[data-lb]:not(.l)::before{content:attr(data-lb);display:block;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
 .tw tr:hover td{background:transparent}.tw tr.c:active,.tw tr.pc:active{transform:scale(.99)}
 #md{align-items:flex-end}.sheet{max-height:94vh;max-height:94dvh;padding:14px 14px 30px;border-radius:20px 20px 0 0}h2{font-size:26px}
 .kp{grid-template-columns:1fr 1fr;gap:8px}.kp b{font-size:21px}.kp small{font-size:11px}
 .sx .opts{width:min(430px,calc(100vw - 24px))}
}
@media(max-width:720px){.tw.ch{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:14px}.rl{height:38px;max-width:84px}.cl h2{overflow-wrap:anywhere}}
body.lk{position:fixed;left:0;right:0;width:100%;overflow:hidden}#md,.sheet{overscroll-behavior:contain}.sheet.sm{width:min(560px,100%)}.sheet{padding-top:0!important;max-height:92vh;max-height:92dvh}.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0 8px;margin-bottom:6px}
.srcs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.srcs a{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;margin:0;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--b) 14%,var(--card));color:var(--b);font-weight:700;font-size:14px;text-decoration:none}
.srcs a:hover{background:color-mix(in srgb,var(--b) 28%,var(--card))}
.cfe,.kp b .cfe,.kp div:first-child b .cfe{color:var(--mute)!important;-webkit-text-fill-color:var(--mute)!important;opacity:.8;text-shadow:none!important}.cft{margin-left:3px;font-size:inherit;font-weight:700;letter-spacing:.02em;text-transform:lowercase;white-space:nowrap}.cft-t{color:var(--a);-webkit-text-fill-color:var(--a)}.cft-s{color:#e8c35a;-webkit-text-fill-color:#e8c35a}.cfl{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}.cfl b{font-weight:600}.cfl b:not(.cfe){color:var(--ink);-webkit-text-fill-color:var(--ink)}
.est{font-style:italic;text-decoration:underline dotted;text-decoration-color:var(--a);text-underline-offset:3px}
@media(max-width:720px),(pointer:coarse){.srcs{gap:10px}.srcs a{min-width:46px;height:46px;font-size:17px;border-radius:12px}.tw td.sc{grid-column:1/-1}}
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 12px}
.ctabs button{background:none;border:0;border-bottom:3px solid transparent;font:700 20px var(--hd);padding:6px 14px;color:var(--mute);margin:0}
.ctabs button[aria-selected=true]{color:var(--ink);border-color:var(--a)}
.cmpw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-top:6px}
.cmpw table{border-collapse:collapse;width:100%}
.cmpw th,.cmpw td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:15px}
.cmpw th{position:static;cursor:default;white-space:normal;min-width:96px;vertical-align:bottom}
.cmpw th:first-child,.cmpw td:first-child{text-align:left;position:sticky;left:0;background:var(--card);color:var(--mute);font-size:13px;min-width:112px;white-space:normal;z-index:1}
.cmpw tr:last-child td{border-bottom:0}
.cmpw td.best{font-weight:700;color:var(--pos)}
.kp div{border:1.5px solid color-mix(in srgb,var(--a) 62%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 10%,var(--card)),var(--card) 62%);box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 8%,transparent),0 10px 26px -14px color-mix(in srgb,var(--a) 60%,transparent)}
.lc{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 7%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--a) 30%,var(--line));border-radius:16px;padding:10px 8px 6px;box-shadow:0 12px 34px -18px color-mix(in srgb,var(--a) 55%,transparent)}
.lc svg{display:block;width:100%;max-width:760px;margin:0 auto;height:auto;overflow:visible}
.lc .tp,.lc .gd{opacity:0;pointer-events:none;transition:opacity .15s}
.lc .pt{cursor:pointer;outline:none}.lc .pt:hover .tp,.lc .pt:focus .tp,.lc .pt:hover .gd,.lc .pt:focus .gd,.lc .pt.sel .tp,.lc .pt.sel .gd{opacity:1}
.lc svg:has(.pt:hover) .pt.sel:not(:hover) .tp,.lc svg:has(.pt:focus) .pt.sel:not(:focus) .tp,.lc svg:has(.pt:hover) .pt.sel:not(:hover) .gd,.lc svg:has(.pt:focus) .pt.sel:not(:focus) .gd{opacity:0}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px}
.pills .chip{padding:5px 14px;font-size:14px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin:10px 2px 2px}
.lgd i{display:inline-block;width:18px;height:4px;border-radius:4px;margin-right:6px;vertical-align:middle}
</style>
<style>
.ppl{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.ppl .pp{--mx:34px;--my:50%;position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;margin:0;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--sh);color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:border-color .6s,box-shadow .8s}
.ppl .pp:hover{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
/* aplinkinis apšvietimas kortelėje (seka žymeklį) */
.ppl .pp::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(190px 95px at var(--mx) var(--my),color-mix(in srgb,var(--a) 36%,transparent),transparent 70%)}
/* šviesos nuvilnijimas per kortelę */
.ppl .pp::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 38%,color-mix(in srgb,#fff 24%,transparent) 50%,transparent 62%);background-size:260% 100%;background-position:130% 0}
.ppl .pp.lit{border-color:color-mix(in srgb,var(--a) 75%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 30%,transparent),0 14px 42px -12px color-mix(in srgb,var(--a) 65%,transparent)}
.ppl .pp.lit::before{opacity:1}
.ppl .pp.lit::after{animation:pp-sweep 1.3s ease-out .1s 1 both}
@keyframes pp-sweep{0%{opacity:1;background-position:130% 0}100%{opacity:0;background-position:-30% 0}}
/* portretas */
.pp-av{position:relative;flex:none;width:56px;height:56px;transition:transform .25s ease-out}
.ppl .pp.lit .pp-av{transform:perspective(260px) rotateY(calc(var(--tx,0)*14deg)) rotateX(calc(var(--ty,0)*-14deg))}
.pp-av::before{content:"";position:absolute;inset:-7px;border-radius:50%;z-index:0;pointer-events:none;opacity:0;scale:.9;transition:opacity .9s;background:radial-gradient(circle,color-mix(in srgb,var(--a) 60%,transparent),transparent 70%)}
.ppl .pp.lit .pp-av::before{opacity:1;animation:pp-breathe 3.2s ease-in-out infinite}
@keyframes pp-breathe{0%,100%{scale:.95}50%{scale:1.16}}
.pp-aura{position:absolute;inset:-8px;border-radius:50%;z-index:0;pointer-events:none;opacity:0;scale:.7;filter:blur(6px);transition:opacity .8s,scale 1s cubic-bezier(.2,.9,.2,1.2);background:conic-gradient(from 0deg,transparent 0 6%,var(--a) 22%,transparent 38% 54%,color-mix(in srgb,var(--a) 55%,#fff) 72%,transparent 90%)}
.ppl .pp.lit .pp-aura{opacity:.95;scale:1;animation:pp-spin 6s linear infinite}
@keyframes pp-spin{to{rotate:360deg}}
.pp-av::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;border:2px solid var(--a);opacity:0}
.ppl .pp.ping .pp-av::after{animation:pp-ping .85s ease-out}
@keyframes pp-ping{0%{opacity:.9;scale:1}100%{opacity:0;scale:2.3}}
.pp-ph{position:absolute;inset:0;z-index:1;isolation:isolate;border-radius:50%;overflow:hidden;opacity:.8;background:var(--card);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--a) 55%,var(--card)),color-mix(in srgb,var(--a) 14%,var(--card)));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--a) 40%,transparent);transition:opacity .8s,box-shadow .8s}
.ppl .pp:hover .pp-ph{opacity:.92}
.ppl .pp.lit .pp-ph{opacity:1;box-shadow:0 0 0 2px var(--a),0 0 20px color-mix(in srgb,var(--a) 65%,transparent)}
.pp-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;-webkit-mask-image:radial-gradient(ellipse 50% 58% at 50% 45%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 50% 58% at 50% 45%,#000 58%,transparent 100%);transition:opacity .9s,transform 1.4s cubic-bezier(.2,.8,.2,1)}
.pp-ph .d{filter:grayscale(1) contrast(1.05) brightness(.9);mix-blend-mode:luminosity}
.pp-ph .c{opacity:0;filter:contrast(1.12) saturate(1.1) brightness(1.05)}
.ppl .pp.lit .pp-ph .c{opacity:.92}
.ppl .pp.lit .pp-ph img{transform:scale(1.08)}
/* spalvų derinimas pagal kortelės akcentą */
.pp-ph::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;transition:opacity .9s;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 80%,transparent),transparent 70%)}
.ppl .pp.lit .pp-ph::after{opacity:.8}
.pp-tx{position:relative;z-index:1}
.pp-tx b{display:block;font:700 18px/1.05 var(--hd);letter-spacing:.01em;transition:text-shadow .8s}
.ppl .pp.lit .pp-tx b{text-shadow:0 0 16px color-mix(in srgb,var(--a) 55%,transparent)}
.pp-tx small{display:block;margin-top:3px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);transition:color .6s}
.ppl .pp.lit .pp-tx small{color:var(--a)}
.pp-3d{position:relative;z-index:1;margin-left:2px;font:700 11px/1 var(--mono,monospace);padding:4px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);transition:background .5s,color .5s,border-color .5s}
.ppl .pp.lit .pp-3d{background:var(--a);color:#1a1200;border-color:var(--a)}
@media(prefers-reduced-motion:reduce){.ppl .pp.lit::after,.ppl .pp.lit .pp-aura,.ppl .pp.lit .pp-av::before,.ppl .pp.ping .pp-av::after{animation:none}.pp-ph img,.pp-av{transition:none}}

/* ===== Ryto logotipas: „įsijungimas“ ===== */
.ry-fx{--px:50%;--py:40%;--tx:0;--ty:0;--bt:translate(-50%,-50%);position:absolute;left:50%;top:calc(50% + 36px);z-index:2;transform:var(--bt);display:block;line-height:0;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .3s ease-out}
.ry-fx .ry-logo{position:static;display:block;height:132px;width:auto;transform:none;pointer-events:none;opacity:.55;filter:grayscale(.65) brightness(.8) contrast(.9);transition:opacity 1.1s,filter 1.2s}
.ry-fx:hover .ry-logo{opacity:.7}
.ry-fx.lit{transform:var(--bt) perspective(420px) rotateY(calc(var(--tx)*16deg)) rotateX(calc(var(--ty)*-16deg))}
.ry-fx.lit .ry-logo{opacity:1;filter:saturate(1.25) contrast(1.1) brightness(1.07) drop-shadow(0 0 12px color-mix(in srgb,var(--a) 75%,transparent)) drop-shadow(0 12px 34px color-mix(in srgb,var(--a) 55%,transparent));animation:ry-on 1s linear 1}
@keyframes ry-on{0%{opacity:.55}7%{opacity:1}13%{opacity:.3}21%{opacity:.95}29%{opacity:.45}41%{opacity:1}52%{opacity:.8}62%,100%{opacity:1}}
/* aplinkinis apšvietimas */

 else{br=br.filter(r=>r.nation===n);ar=ar.filter(r=>(r.country||r.nation)===n)}
 if(dv){br=br.filter(r=>r.div===dv);ar=ar.filter(r=>r.div===dv)}
 return{br:br.filter(r=>r.total!=null),ar:ar.filter(r=>r.avg!=null)}}

 ["Bendras biudžetas",c=>c.b&&c.b.total,eur,"max"],["Atlyginimų biudžetas",c=>c.b&&c.b.sal,eur,"max"],["Atlyginimų dalis",c=>c.b&&c.b.share,pct,""],
 ["Biudžeto pokytis",c=>c.b&&c.b.chg,sg,"max"],["Vieta lygoje",c=>c.b&&c.b.place,n0,"min"],["Europos turnyras",c=>c.b&&c.b.eu,esc,""],
 ["Vid. lankomumas",c=>c.a&&c.a.avg,n0,"max"],["Galima arenos talpa",c=>c.a&&c.a.cap,n0,"max"],["Užpildymas",c=>c.a&&c.a.fill,pct,"max"],
 ["Sirgalių traukos indeksas vs Europos konkurentai",c=>c.a&&c.a.idxE,f2,"max"],["Sirgalių traukos indeksas vs vietiniai konkurentai",c=>c.a&&c.a.idxL,f2,"max"]];
const LR=[["Klubų skaičius",c=>c.br.length||null,n0,""],["Vid. biudžetas",c=>mean(c.br.map(r=>r.total)),eur,"max"],["Biudžetų mediana",c=>med(c.br.map(r=>r.total)),eur,"max"],
 ["Didžiausias biudžetas",c=>c.br.length?Math.max(...c.br.map(r=>r.total)):null,eur,"max"],["Vid. atlyginimų biudžetas",c=>mean(c.br.map(r=>r.sal)),eur,"max"],
 ["Vid. atlyginimų dalis",c=>mean(c.br.map(r=>r.share)),pct,""],["Vid. klubų lankomumas",c=>mean(c.ar.map(r=>r.avg)),n0,"max"],
 ["Lankomumo mediana",c=>med(c.ar.map(r=>r.avg)),n0,"max"],["Didžiausias klubo lankomumas",c=>c.ar.length?Math.max(...c.ar.map(r=>r.avg)):null,n0,"max"],["Vid. užpildymas",c=>mean(c.ar.map(r=>r.fill)),pct,"max"]];
const PR=[["Pareigos",c=>c.last.role,esc,""],["Komanda",c=>c.last.team,esc,""],["Lyga",c=>c.last.div,v=>RN[v]||v,""],["Paskutinis sezonas",c=>c.last.season,esc,""],
 ["Mėnesio alga",c=>c.last.month,eur,"max"],["Sutarties vertė",c=>c.last.value,eur,"max"],["Didžiausia mėnesio alga",c=>c.peak&&c.peak.month,eur,"max"],
 ["Sezonas (didžiausia alga)",c=>c.peak&&c.peak.season,esc,""],["Įrašų skaičius",c=>c.P.length,n0,""],["Sezonų skaičius",c=>new Set(c.P.map(p=>p.season)).size,n0,""]];
// Anglų kalba tr() išverčia ir data-* atributus (pvz. „Lietuva|Rytas“ → „Lithuania|Rytas“), todėl šalį grąžiname į lietuvišką
const unk=k=>{const i=String(k).indexOf("|");if(i<0)return k;const n=k.slice(0,i);return(NAT[n]||n)+k.slice(i)};
function cmpAct(d){const C=S.cmp;if(d.cra!==undefined)d={cra:unk(d.cra)};else if(d.crm!==undefined)d={crm:unk(d.crm)};
 if(d.cm!==undefined){C.mode=d.cm;C.items=[];C.q=""}
 else if(d.cms!==undefined)C.season=d.cms;
 else if(d.cra!==undefined){const mx=C.mode==="cseason"?1:4;if(!C.items.includes(d.cra))C.items=[...C.items,d.cra].slice(-mx);C.q=""}
 else if(d.crm!==undefined)C.items=C.items.filter(k=>k!==d.crm)}
function cmpView(){const C=S.cmp,m=C.mode,MODES=[["club","Klubai"],["league","Lygos"],["cseason","Klubo sezonai"],["player","Žaidėjai"]],
 SE=[...new Set([...D.bud.map(r=>r.season),...D.att.map(r=>r.season)])].filter(Boolean).sort().reverse(),
 lab=k=>{if(m==="player")return k;const[n,x]=k.split("|");if(m==="league")return n==="ABA"?"ABA":n+(+x?" · Lyga "+(RN[x]||x):"");return x},
 q=norm(C.q);let cand=[];
 if(m==="league")cand=leagueOpts().filter(o=>mt(o.label+" "+(LT2EN[o.label]||""),C.q));
 else if(wd(C.q).length)cand=(m==="player"?playerNames():clubList().map(c=>({k:c.n+"|"+c.name,label:c.name,sub:c.n}))).filter(o=>mt(o.label+" "+o.sub+" "+(LT2EN[o.sub]||""),C.q)).sort((x,y)=>(norm(x.label).startsWith(norm(C.q))?0:1)-(norm(y.label).startsWith(norm(C.q))?0:1));
 cand=cand.filter(o=>!C.items.includes(o.k)).slice(0,m==="league"?40:8);
 let cols=[],rows=[],hint="";
 if(C.items.length){
  if(m==="club")cols=C.items.map(k=>{const[n,name]=k.split("|");return{h:name,sub:n,ctx:cmClub({n,name},C.season)}}),rows=CR;
  else if(m==="league")cols=C.items.map(k=>({h:lab(k),sub:"",ctx:cmLeague(k,C.season)})),rows=LR;
  else if(m==="cseason"){const[n,name]=C.items[0].split("|"),mm=r=>(r.nation===n||r.country===n)&&same(r.club,name),se=[...new Set([...D.bud.filter(mm).map(r=>r.season),...D.att.filter(mm).map(r=>r.season)])].sort().slice(-8);cols=se.map(x=>({h:x,sub:"",ctx:cmClub({n,name},x)}));rows=CR;hint=`${name} · ${n}`}
  else cols=C.items.map(k=>{const P=D.sal.filter(p=>p.name===k).sort((x,y)=>(x.season||"").localeCompare(y.season||"")),last=P[P.length-1]||{},peak=P.filter(p=>p.month!=null).sort((x,y)=>y.month-x.month)[0];return{h:k,sub:"",ctx:{P,last,peak}}}),rows=PR}
 const ok=v=>v!=null&&v!==false&&v!==""&&!(typeof v==="number"&&isNaN(v));
 const body=rows.map(([l,f,fmt,hl])=>{const vals=cols.map(c=>{try{return f(c.ctx)}catch(e){return null}});if(!vals.some(ok))return"";
  const nums=vals.filter(v=>typeof v==="number"&&ok(v)),best=hl&&nums.length>1&&new Set(nums).size>1?(hl==="max"?Math.max(...nums):Math.min(...nums)):null;
  return`<tr><td>${l}</td>${vals.map(v=>`<td class="${best!==null&&v===best?"best":""}">${ok(v)?fmt(v):'<span class="na">–</span>'}</td>`).join("")}</tr>`}).join("");
 return`<div class="bar n">${MODES.map(([k,l])=>`<button class="chip" data-cm="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>`
  +(m==="club"||m==="league"?sx(`Sezonas ${C.season}`,SE,s=>`<button class="chip" data-cms="${s}" aria-pressed="${C.season===s}">Sezonas ${s}</button>`):"")
  +(C.items.length?`<div class="bar">${C.items.map(k=>`<button class="chip" data-crm="${esc(k)}" aria-pressed="true">${esc(lab(k))} ✕</button>`).join("")}</div>`:"")
  +`<div class="bar"><input type="search" id="cq" placeholder="Ieškoti…" value="${esc(C.q)}" aria-label="Paieška"></div>`
  +(cand.length?`<div class="bar">${cand.map(o=>`<button class="chip" data-cra="${esc(o.k)}">+ ${esc(o.label)}${o.sub?` <small style="color:var(--mute)">${esc(o.sub)}</small>`:""}</button>`).join("")}</div>`:"")
  +(hint?`<p class="sum">${esc(hint)}</p>`:"")
  +(cols.length?`<div class="cmpw"><table><thead><tr><th>Rodiklis</th>${cols.map(c=>`<th>${esc(c.h)}${c.sub?`<small style="display:block;color:var(--mute);font:400 12px var(--tx)">${esc(c.sub)}</small>`:""}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`:`<p class="sum">Pasirink, ką lyginti – paieška aukščiau.</p>`)}

 $tabs.innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${tr(l)}</button>`).join("");

 if(fid){const i=$(fid);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}

document.addEventListener("click",e=>{if(e.target.id==="md")return closeAll();

 if(t.matches("tr.c")){const r=V[+t.dataset.i];return S.tab==="sal"?player(r.name):club(r.club,S.tab==="att"?(r.country||r.nation):r.nation,r.season||"25/26",0,S.tab==="att"?"att":"",S.tab==="att"?r.season:undefined)}
 if(t.dataset.ca)return club(t.dataset.n,NAT[t.dataset.nat]||t.dataset.nat,t.dataset.ss,1,"att",t.dataset.ca);
 if(t.dataset.ct)return club(t.dataset.n,NAT[t.dataset.nat]||t.dataset.nat,t.dataset.ss,1,t.dataset.ct);
 if(t.dataset.cs)return club(t.dataset.n,NAT[t.dataset.nat]||t.dataset.nat,t.dataset.cs,1);
 if(t.dataset.p)return player(t.dataset.p);
 if(t.dataset.club!==undefined)return club(t.dataset.club,"",t.dataset.season);
 if(t.dataset.cm!==undefined||t.dataset.cms!==undefined||t.dataset.cra!==undefined||t.dataset.crm!==undefined){cmpAct(t.dataset);return render()}
 if(t.dataset.tab){S.tab=t.dataset.tab;S.nation="";S.eu="";S.q=""}
 else if(t.dataset.nation!==undefined)S.nation=NAT[t.dataset.nation]||t.dataset.nation;
 else if(t.dataset.eu!==undefined)S.eu=t.dataset.eu;
 else if(t.dataset.aseason){S.aseason=t.dataset.aseason;S.nation=""}
 else if(t.dataset.season)S.season=t.dataset.season;
 else if(t.dataset.k){const s=S.sort[S.tab];S.sort[S.tab]=[t.dataset.k,s[0]===t.dataset.k?-s[1]:(t.dataset.k==="club"||t.dataset.k==="name"?1:-1)]}
 else return start();
 render()});
