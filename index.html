<style>

*{box-sizing:border-box}

h2,h3{font-family:var(--hd);margin:8px 0 4px}h2{font-size:30px;margin:0}.top{display:flex;gap:8px;margin-bottom:10px}.top button{margin-left:auto}
.top button,.lk{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;color:var(--ink);text-decoration:none;font-size:14px}

body{background:radial-gradient(900px 380px at 85% -8%,color-mix(in srgb,var(--a) 16%,transparent),transparent),radial-gradient(700px 320px at -5% 0,color-mix(in srgb,var(--b) 12%,transparent),transparent),var(--bg);background-attachment:fixed}

.sh i{background:color-mix(in srgb,var(--b) 28%,transparent);height:9px;border-radius:9px}.sh i b{background:linear-gradient(90deg,#ffd54a,#ff8a00);border-radius:9px}
.kp b{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 55%,var(--b)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.kp b .pos,.kp b .neg{-webkit-text-fill-color:currentColor}

.ms{display:none;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;width:100%}
@media(max-width:720px){
 header{padding:14px 14px 0}h1{font-size:28px}#st{margin-left:0;width:100%}main{padding:12px 12px 60px}nav{padding:10px 12px 0}
 .bar{gap:6px}.bar.n{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.bar.n .chip{white-space:nowrap;flex:none}input[type=search]{width:100%;margin:0}

 .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
 .tw table,.tw tbody,.tw tr,.tw td{display:block}.tw thead{display:none}
 .tw tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}

 .tw td.l{grid-column:1/-1;font-size:18px}.tw td.l small{display:block;margin-bottom:2px}
 .tw td[data-lb]:not(.l)::before{content:attr(data-lb);display:block;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
 .tw tr:hover td{background:transparent}.tw tr.c:active,.tw tr.pc:active{transform:scale(.99)}
 #md{align-items:flex-end}.sheet{max-height:94vh;max-height:94dvh;padding:14px 14px 30px;border-radius:20px 20px 0 0}h2{font-size:26px}
 .kp{grid-template-columns:1fr 1fr;gap:8px}.kp b{font-size:21px}.kp small{font-size:11px}
 .sx .opts{width:min(430px,calc(100vw - 24px))}
}
@media(max-width:720px){.tw.ch{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:14px}.rl{height:38px;max-width:84px}.cl h2{overflow-wrap:anywhere}}
body.lk{position:fixed;left:0;right:0;width:100%;overflow:hidden}#md,.sheet{overscroll-behavior:contain}.sheet.sm{width:min(560px,100%)}.sheet{padding-top:0!important;max-height:92vh;max-height:92dvh}.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0 8px;margin-bottom:6px}
.srcs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.srcs a{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;margin:0;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--b) 14%,var(--card));color:var(--b);font-weight:700;font-size:14px;text-decoration:none}
.srcs a:hover{background:color-mix(in srgb,var(--b) 28%,var(--card))}
.est{font-style:italic;text-decoration:underline dotted;text-decoration-color:var(--a);text-underline-offset:3px}
@media(max-width:720px),(pointer:coarse){.srcs{gap:10px}.srcs a{min-width:46px;height:46px;font-size:17px;border-radius:12px}.tw td.sc{grid-column:1/-1}}
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 12px}
.ctabs button{background:none;border:0;border-bottom:3px solid transparent;font:700 20px var(--hd);padding:6px 14px;color:var(--mute);margin:0}
.ctabs button[aria-selected=true]{color:var(--ink);border-color:var(--a)}
.cmpw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin-top:6px}
.cmpw table{border-collapse:collapse;width:100%}
.cmpw th,.cmpw td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:15px}
.cmpw th{position:static;cursor:default;white-space:normal;min-width:96px;vertical-align:bottom}
.cmpw th:first-child,.cmpw td:first-child{text-align:left;position:sticky;left:0;background:var(--card);color:var(--mute);font-size:13px;min-width:112px;white-space:normal;z-index:1}
.cmpw tr:last-child td{border-bottom:0}
.cmpw td.best{font-weight:700;color:var(--pos)}
</style>

<body>
<header><h1 id="h1">Krepšinio klubų finansai</h1><span id="st">Kraunama…</span><button class="ic" id="th" aria-label="Tema"></button><span id="lang"><button class="chip" data-l="lt">LT</button> <button class="chip" data-l="en">EN</button></span></header>
<nav role="tablist" id="tabs"></nav>
<main id="out"></main>
<div id="md" aria-modal="true" role="dialog"><div class="sheet" id="sh"></div></div>
<script>
// ---- Nustatymai: Google lentelės ID (turi būti tikra Google Sheets lentelė, ne .xlsx) ----
const SHEET_ID="1cWx_skBNVz6XwtdFsHNX5Jhd2TwRLFiY";
// Kiekvienam lapui – galimi pavadinimai (su „/" ir be). Pirmas tinkamas naudojamas.
const SHEETS={b27:["Budgets 26/27","Budgets 2627"],b26:["Budgets 25/26","Budgets 2526"],w26:["World 25/26","World 2526"],att:["Attendance 25/26","Attendance 2526","Attendance"],sal:["Player Salaries"],hist:["Historical Budgets"],histatt:["Historical Attendance"]};
const C="Australia|Australija|AU;Austria|Austrija|AT;Belgium|Belgija|BE;Bosnia and Herzegovina|Bosnija ir Hercegovina|BA;Croatia|Kroatija|HR;Czech Republic|Čekija|CZ;Denmark|Danija|DK;Estonia|Estija|EE;Finland|Suomija|FI;France|Prancūzija|FR;Germany|Vokietija|DE;Greece|Graikija|GR;Hungary|Vengrija|HU;Israel|Izraelis|IL;Italy|Italija|IT;Japan|Japonija|JP;Latvia|Latvija|LV;Lithuania|Lietuva|LT;Montenegro|Juodkalnija|ME;North Macedonia|Šiaurės Makedonija|MK;Poland|Lenkija|PL;Portugal|Portugalija|PT;Romania|Rumunija|RO;Serbia|Serbija|RS;Slovakia|Slovakija|SK;Slovenia|Slovėnija|SI;Spain|Ispanija|ES;Turkey|Turkija|TR;United Arab Emirates|Jungtiniai Arabų Emyratai|AE;United Kingdom|Jungtinė Karalystė|GB;Ukraine|Ukraina|UA;Bulgaria|Bulgarija|BG;Georgia|Gruzija|GE;Cyprus|Kipras|CY;Netherlands|Nyderlandai|NL;Switzerland|Šveicarija|CH;Sweden|Švedija|SE;Norway|Norvegija|NO;Iceland|Islandija|IS;Kosovo|Kosovas|XK;Azerbaijan|Azerbaidžanas|AZ;Ireland|Airija|IE;Albania|Albanija|AL;Russia|Rusija|RU".split(";").map(s=>s.split("|"));
const NAT=Object.fromEntries(C.map(c=>[c[0],c[1]])),FL=Object.fromEntries(C.map(c=>[c[1],c[2]]));
const flag=n=>FL[n]?String.fromCodePoint(...[...FL[n]].map(c=>127397+c.charCodeAt(0)))+" ":"";
const LT2EN=Object.fromEntries(C.map(c=>[c[1],c[0]])),dn=n=>LANG==="en"?(LT2EN[n]||n):n;
let nf=new Intl.NumberFormat("lt-LT",{maximumFractionDigits:0});
const eur=n=>n==null?"–":nf.format(n)+" €";
const E=(t,e)=>e?`<span class="est">~${t}</span>`:t,eE=(n,e)=>E(eur(n),e&&n!=null);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");
const nat=n=>NAT[n]||n;
const num=v=>{if(v==null)return null;const s=String(v).replace(/[\s\u00a0€$%~≈*]/g,"").replace(/,/g,"");if(!/^-?\d/.test(s))return null;const n=parseFloat(s);return isNaN(n)?null:n};
const est=v=>num(v)!=null&&/[~≈*]/.test(String(v));
const txt=v=>{const s=String(v??"").trim();return(s===""||s==="-"||s[0]==="#")?"":s};
function csv(t){const R=[];let r=[],c="",q=0;for(let i=0;i<t.length;i++){const h=t[i];
 if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}
 else if(h=='"')q=1;else if(h==","){r.push(c);c=""}else if(h=="\n"){r.push(c);R.push(r);r=[];c=""}else if(h!="\r")c+=h}
 if(c||r.length){r.push(c);R.push(r)}return R}
let DEF;
async function raw(n){
 const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(n)}`);
 const t=await res.text();
 if(!res.ok||/^\s*</.test(t))throw new Error(`Lapas „${n}" neatsidaro (HTTP ${res.status})`);
 return t}
// Jei lapo pavadinimas neegzistuoja, Google tyliai grąžina pirmą lapą – tokį atsakymą atmetame
async function load(names,first){
 for(const n of names){const t=await raw(n);if(first||t!==DEF)return csv(t)}
 throw new Error(`Lapas „${names[0]}" nerastas – patikrinkite jo pavadinimą lentelėje`)}
// Suranda lenteles, kurių antraštės eilutė prasideda reikšme hdr antrame stulpelyje
function blocks(rows,hdr){const out=[];let title="";
 for(let i=0;i<rows.length;i++){const a=(rows[i][1]||"").trim();
  if(a===hdr){const h=rows[i].map(x=>x.trim()),d=[];let j=i+1;
   while(j<rows.length){const b=(rows[j][1]||"").trim();if(!b||b===hdr||/^Vidurkis/.test(b))break;d.push(rows[j]);j++}
   out.push({title,h,d});i=j-1}
  else if(a)title=a}
 return out}
const ix=(h,re)=>h.findIndex(x=>re.test(x));
function budgets(rows,season,world){const o=[];
 for(const b of blocks(rows,"Nation")){/* Google CSV „pameta" antraštes skaitinių stulpelių viršuje, todėl stulpeliai imami pagal vietą: B šalis, C klubas, D biudžetas, E algos, H vieta, I Europa, J+ šaltiniai */
  const sn=season==="H"?(b.title.match(/(\d\d)\s*\/\s*(\d\d)\s*$/)||[]).slice(1).join("/"):season;if(!sn)continue;
  const ci=b.h.indexOf("Club"),dv=ci>2?ci-2:0,q=season==="26/27"?1:0,c={n:1,club:2+dv,t:3+dv,s:4+dv,p:6+q+dv,e:7+q+dv};
  const src=[8,9,10,11].map(i=>i+q+dv);
  for(const r of b.d){if(!txt(r[c.club]))continue;
   o.push({season:sn,nation:nat(r[1].trim()),div:dv?num(r[2]):null,club:r[c.club].trim(),total:num(r[c.t]),sal:num(r[c.s]),place:num(r[c.p]),eu:txt(r[c.e]).replace(/^https?:.*/,""),est:{total:est(r[c.t]),sal:est(r[c.s])},src:src.map(i=>(r[i]||"").trim()).filter(u=>/^https?:/.test(u))})}}
 return o}
const AD={French:"France",German:"Germany",Spanish:"Spain",Italian:"Italy",Lithuanian:"Lithuania",Greek:"Greece",Turkish:"Turkey",Israeli:"Israel",Polish:"Poland",Serbian:"Serbia",Latvian:"Latvia",Estonian:"Estonia",Finnish:"Finland"};
const fr=v=>{const n=num(v);return n==null?null:/%/.test(String(v))||n>1.5?n/100:n};
function attendance(rows,def){const o=[],dv=rows.some(r=>(r[2]||"").trim()==="Club")?1:0;let title="",season=def||"";
 const setT=t=>{title=t.replace(/\s*\d\d\s*\/\s*\d\d\s*$/,"");const m=t.match(/(\d\d)\s*\/\s*(\d\d)\s*$/);season=m?m[1]+"/"+m[2]:(def||"")};
 for(const r of rows){const first=(r[1]||"").trim(),a=(r[1+dv]||"").trim();
  if(dv&&!a&&first&&!/^\d+$/.test(first)&&first!=="Division"){setT(first);continue}
  if(!a||a==="Club"||a==="Klubas")continue;
  if(num(r[5+dv])==null&&num(r[6+dv])==null){if(!dv)setT(a);continue}
  const m=title.match(/^(\w+) league/i),nation=m&&AD[m[1]]?nat(AD[m[1]]):title.replace(/\s*\(.*/,"").replace(/ league$/i,"");
  const nums=String(r[6+dv]).split("/").map(num).filter(x=>x!=null),avg=num(r[5+dv]),cap=nums.length?nums[nums.length-1]:null;
  o.push({season,nation,div:dv?num(first):null,club:a,city:txt(r[2+dv]),avg,cap,est:{avg:est(r[5+dv]),cap:est(r[6+dv])},fill:fr(r[7+dv])??(avg!=null&&cap?avg/cap:null),expE:num(r[11+dv]),idxE:num(r[12+dv]),expL:num(r[13+dv]),idxL:num(r[14+dv]),profile:txt(r[15+dv]),place:num(r[16+dv])})}
 return o}
// ---- Gyvi lankomumo duomenys (ACBattendance projektas: ACB, BBL, LKL) ----
const LIVE_BASE=["https://andriuspanama.github.io/ACBattendance/","https://raw.githubusercontent.com/andriuspanama/ACBattendance/main/"];
const LIVE=[["data/attendance_averages.json","Spain"],["data/bbl/attendance_averages.json","Germany"],["data/lkl/attendance_averages.json","Lithuania"]];
// Pavadinimai, kuriuos ACBattendance naudoja kitaip nei lentelė
const LAL={"Recoletas Salud San Pablo Burgos":"CB San Pablo Burgos","Kosner Baskonia":"Saski Baskonia","Casademont Zaragoza":"Basket Zaragoza","Leyma Coruna":"Basquet Coruna","Monbus Obradoiro":"Obradoiro CAB","Ilerna Lleida":"Forca Lleida CE","Rio Breogan":"Club Baloncesto Breogan","Asisa Joventut":"Club Joventut Badalona","Fiatc Girona":"Basquet Girona","Barca":"FC Barcelona Basquet","Kidsandus Manresa":"Basquet Manresa","La Laguna Tenerife":"CB Canarias Tenerife","Morabanc Andorra":"BC Andorra","Ulm":"Ratiopharm Ulm","Basketball Braunschweig":"Lowen Braunschweig"};
async function getJ(path){for(const b of LIVE_BASE){try{const r=await fetch(b+path+"?t="+Math.floor(Date.now()/60000));if(r.ok)return await r.json()}catch(e){}}return null}

  const nums=vals.filter(v=>typeof v==="number"&&ok(v)),best=hl&&nums.length>1&&new Set(nums).size>1?(hl==="max"?Math.max(...nums):Math.min(...nums)):null;
  return`<tr><td>${l}</td>${vals.map(v=>`<td class="${best!==null&&v===best?"best":""}">${ok(v)?fmt(v):'<span class="na">–</span>'}</td>`).join("")}</tr>`}).join("");
 return`<div class="bar n">${MODES.map(([k,l])=>`<button class="chip" data-cm="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>`
  +(m==="club"||m==="league"?sx(`Sezonas ${C.season}`,SE,s=>`<button class="chip" data-cms="${s}" aria-pressed="${C.season===s}">Sezonas ${s}</button>`):"")
  +(C.items.length?`<div class="bar">${C.items.map(k=>`<button class="chip" data-crm="${esc(k)}" aria-pressed="true">${esc(lab(k))} ✕</button>`).join("")}</div>`:"")
  +`<div class="bar"><input type="search" id="cq" placeholder="Ieškoti…" value="${esc(C.q)}" aria-label="Paieška"></div>`
  +(cand.length?`<div class="bar">${cand.map(o=>`<button class="chip" data-cra="${esc(o.k)}">+ ${esc(o.label)}${o.sub?` <small style="color:var(--mute)">${esc(o.sub)}</small>`:""}</button>`).join("")}</div>`:"")
  +(hint?`<p class="sum">${esc(hint)}</p>`:"")
  +(cols.length?`<div class="cmpw"><table><thead><tr><th>Rodiklis</th>${cols.map(c=>`<th>${esc(c.h)}${c.sub?`<small style="display:block;color:var(--mute);font:400 12px var(--tx)">${esc(c.sub)}</small>`:""}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`:`<p class="sum">Pasirink, ką lyginti – paieška aukščiau.</p>`)}

 $tabs.innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${tr(l)}</button>`).join("");
 const fid=document.activeElement&&["q","cq"].includes(document.activeElement.id)?document.activeElement.id:null;

 if(fid){const i=$(fid);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
const $=id=>document.getElementById(id),$tabs=$("tabs"),out=$("out");
document.addEventListener("click",e=>{if(e.target.id==="md")return closeAll();
 if(e.target.closest("a"))return;
 const t=e.target.closest("#th,[data-l],#cl,#bk,tr.c,[data-p],[data-club],[data-tab],[data-nation],[data-season],th[data-k],[data-cs],[data-ct],[data-ca],[data-aseason],[data-cm],[data-cms],[data-cra],[data-crm],#reload");if(!t)return;
 if(t.id==="th")return setTheme(isDark()?"light":"dark");
 if(t.dataset.l)return setLang(t.dataset.l);
 if(t.id==="cl")return closeAll();if(t.id==="bk")return HP?history.back():closeAll();
 if(t.matches("tr.c")){const r=V[+t.dataset.i];return S.tab==="sal"?player(r.name):club(r.club,S.tab==="att"?(r.country||r.nation):r.nation,r.season||"25/26",0,S.tab==="att"?"att":"",S.tab==="att"?r.season:undefined)}
 if(t.dataset.ca)return club(t.dataset.n,NAT[t.dataset.nat]||t.dataset.nat,t.dataset.ss,1,"att",t.dataset.ca);
 if(t.dataset.ct)return club(t.dataset.n,NAT[t.dataset.nat]||t.dataset.nat,t.dataset.ss,1,t.dataset.ct);
 if(t.dataset.cs)return club(t.dataset.n,NAT[t.dataset.nat]||t.dataset.nat,t.dataset.cs,1);
 if(t.dataset.p)return player(t.dataset.p);
 if(t.dataset.club!==undefined)return club(t.dataset.club,"",t.dataset.season);
 if(t.dataset.cm!==undefined||t.dataset.cms!==undefined||t.dataset.cra!==undefined||t.dataset.crm!==undefined){cmpAct(t.dataset);return render()}
 if(t.dataset.tab){S.tab=t.dataset.tab;S.nation="";S.q=""}
 else if(t.dataset.nation!==undefined)S.nation=NAT[t.dataset.nation]||t.dataset.nation;
 else if(t.dataset.aseason){S.aseason=t.dataset.aseason;S.nation=""}
 else if(t.dataset.season)S.season=t.dataset.season;
 else if(t.dataset.k){const s=S.sort[S.tab];S.sort[S.tab]=[t.dataset.k,s[0]===t.dataset.k?-s[1]:(t.dataset.k==="club"||t.dataset.k==="name"?1:-1)]}
 else return start();
 render()});

 }catch(err){

if(TH)document.documentElement.setAttribute("data-t",TH);$("th").textContent=isDark()?"☀️":"🌙";
setLang(LANG);
start();
