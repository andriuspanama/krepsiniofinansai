<script>
// ---- Nustatymai: Google lentelės ID (turi būti tikra Google Sheets lentelė, ne .xlsx) ----
const SHEET_ID="1cWx_skBNVz6XwtdFsHNX5Jhd2TwRLFiY";
// Kiekvienam lapui – galimi pavadinimai (su „/" ir be). Pirmas tinkamas naudojamas.
const SHEETS={b27:["Budgets 26/27","Budgets 2627"],b26:["Budgets 25/26","Budgets 2526"],w26:["World 25/26","World 2526"],att:["Attendance 25/26","Attendance 2526","Attendance"],sal:["Player Salaries"],hist:["Historical Budgets"]};
const C="Australia|Australija|AU;Austria|Austrija|AT;Belgium|Belgija|BE;Bosnia and Herzegovina|Bosnija ir Hercegovina|BA;Croatia|Kroatija|HR;Czech Republic|Čekija|CZ;Denmark|Danija|DK;Estonia|Estija|EE;Finland|Suomija|FI;France|Prancūzija|FR;Germany|Vokietija|DE;Greece|Graikija|GR;Hungary|Vengrija|HU;Israel|Izraelis|IL;Italy|Italija|IT;Japan|Japonija|JP;Latvia|Latvija|LV;Lithuania|Lietuva|LT;Montenegro|Juodkalnija|ME;North Macedonia|Šiaurės Makedonija|MK;Poland|Lenkija|PL;Portugal|Portugalija|PT;Romania|Rumunija|RO;Serbia|Serbija|RS;Slovakia|Slovakija|SK;Slovenia|Slovėnija|SI;Spain|Ispanija|ES;Turkey|Turkija|TR;United Arab Emirates|Jungtiniai Arabų Emyratai|AE;United Kingdom|Jungtinė Karalystė|GB;Ukraine|Ukraina|UA;Bulgaria|Bulgarija|BG;Georgia|Gruzija|GE;Cyprus|Kipras|CY;Netherlands|Nyderlandai|NL;Switzerland|Šveicarija|CH;Sweden|Švedija|SE;Norway|Norvegija|NO;Iceland|Islandija|IS;Kosovo|Kosovas|XK;Azerbaijan|Azerbaidžanas|AZ;Ireland|Airija|IE;Albania|Albanija|AL;Russia|Rusija|RU".split(";").map(s=>s.split("|"));
const NAT=Object.fromEntries(C.map(c=>[c[0],c[1]])),FL=Object.fromEntries(C.map(c=>[c[1],c[2]]));
const flag=n=>FL[n]?String.fromCodePoint(...[...FL[n]].map(c=>127397+c.charCodeAt(0)))+" ":"";
const LT2EN=Object.fromEntries(C.map(c=>[c[1],c[0]])),dn=n=>LANG==="en"?(LT2EN[n]||n):n;
let nf=new Intl.NumberFormat("lt-LT",{maximumFractionDigits:0});
const eur=n=>n==null?"–":nf.format(n)+" €";
const E=(t,e)=>e?`<span class="est">~${t}</span>`:t,eE=(n,e)=>E(eur(n),e&&n!=null);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");
const nat=n=>NAT[n]||n;
const num=v=>{if(v==null)return null;const s=String(v).replace(/[\s\u00a0€$%~≈*]/g,"").replace(/,/g,"");if(!/^-?\d/.test(s))return null;const n=parseFloat(s);return isNaN(n)?null:n};
const est=v=>num(v)!=null&&/[~≈*]/.test(String(v));
const txt=v=>{const s=String(v??"").trim();return(s===""||s==="-"||s[0]==="#")?"":s};
function csv(t){const R=[];let r=[],c="",q=0;for(let i=0;i<t.length;i++){const h=t[i];
 if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}
 else if(h=='"')q=1;else if(h==","){r.push(c);c=""}else if(h=="\n"){r.push(c);R.push(r);r=[];c=""}else if(h!="\r")c+=h}
 if(c||r.length){r.push(c);R.push(r)}return R}
let DEF;
async function raw(n){
 const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(n)}`);
 const t=await res.text();
 if(!res.ok||/^\s*</.test(t))throw new Error(`Lapas „${n}" neatsidaro (HTTP ${res.status})`);
 return t}
// Jei lapo pavadinimas neegzistuoja, Google tyliai grąžina pirmą lapą – tokį atsakymą atmetame
async function load(names,first){
 for(const n of names){const t=await raw(n);if(first||t!==DEF)return csv(t)}
 throw new Error(`Lapas „${names[0]}" nerastas – patikrinkite jo pavadinimą lentelėje`)}
// Suranda lenteles, kurių antraštės eilutė prasideda reikšme hdr antrame stulpelyje
function blocks(rows,hdr){const out=[];let title="";
 for(let i=0;i<rows.length;i++){const a=(rows[i][1]||"").trim();
  if(a===hdr){const h=rows[i].map(x=>x.trim()),d=[];let j=i+1;
   while(j<rows.length){const b=(rows[j][1]||"").trim();if(!b||b===hdr||/^Vidurkis/.test(b))break;d.push(rows[j]);j++}
   out.push({title,h,d});i=j-1}
  else if(a)title=a}
 return out}
const ix=(h,re)=>h.findIndex(x=>re.test(x));
function budgets(rows,season,world){const o=[];
 for(const b of blocks(rows,"Nation")){/* Google CSV „pameta" antraštes skaitinių stulpelių viršuje, todėl stulpeliai imami pagal vietą: B šalis, C klubas, D biudžetas, E algos, H vieta, I Europa, J+ šaltiniai */
  const sn=season==="H"?(b.title.match(/(\d\d)\s*\/\s*(\d\d)\s*$/)||[]).slice(1).join("/"):season;if(!sn)continue;
  const q=season==="26/27"?1:0,c={n:1,club:2,t:3,s:4,p:6+q,e:7+q};
  const src=[8,9,10,11].map(i=>i+q);
  for(const r of b.d){if(!txt(r[c.club]))continue;
   o.push({season:sn,nation:nat(r[1].trim()),club:r[c.club].trim(),total:num(r[c.t]),sal:num(r[c.s]),place:num(r[c.p]),eu:txt(r[c.e]).replace(/^https?:.*/,""),est:{total:est(r[c.t]),sal:est(r[c.s])},src:src.map(i=>(r[i]||"").trim()).filter(u=>/^https?:/.test(u))})}}
 return o}
const AD={French:"France",German:"Germany",Spanish:"Spain",Italian:"Italy",Lithuanian:"Lithuania",Greek:"Greece",Turkish:"Turkey",Israeli:"Israel",Polish:"Poland",Serbian:"Serbia",Latvian:"Latvia",Estonian:"Estonia",Finnish:"Finland"};
const fr=v=>{const n=num(v);return n==null?null:/%/.test(String(v))||n>1.5?n/100:n};
function attendance(rows){const o=[];let title="";
 for(const r of rows){const a=(r[1]||"").trim();if(!a||a==="Club"||a==="Klubas")continue;
  if(num(r[5])==null&&num(r[6])==null){title=a;continue}
  const m=title.match(/^(\w+) league/i),nation=m&&AD[m[1]]?nat(AD[m[1]]):title.replace(/\s*\(.*/,"").replace(/ league$/i,"");
  const nums=String(r[6]).split("/").map(num).filter(x=>x!=null),avg=num(r[5]),cap=nums.length?nums[nums.length-1]:null;
  o.push({nation,club:a,city:txt(r[2]),avg,cap,est:{avg:est(r[5]),cap:est(r[6])},fill:fr(r[7])??(avg!=null&&cap?avg/cap:null),expE:num(r[11]),idxE:num(r[12]),expL:num(r[13]),idxL:num(r[14]),profile:txt(r[15]),place:num(r[16])})}
 return o}
function salaries(rows){const o=[];
 for(const b of blocks(rows,"Role")){const g=i=>i;
  for(const r of b.d){if(!txt(r[2]))continue;
   o.push({role:r[1].trim(),name:r[2].trim(),country:nat((r[3]||"").trim()),team:txt(r[4]),season:txt(r[5]),value:num(r[6]),len:txt(r[7]),month:num(r[8]),est:{value:est(r[6]),month:est(r[8])},src:[9,10,11,12].map(i=>(r[i]||"").trim()).filter(u=>/^https?:/.test(u))})}}
 return o}
function taxes(rows){return rows.filter(r=>txt(r[3])&&!/^https?:/.test(r[1])).map(r=>({country:r[1].trim(),season:txt(r[2]),text:r[3].trim(),src:(r[4]||"").trim()}))}

const EN={"Krepšinio klubų finansai":"Basketball Club Finances","Kraunama…":"Loading…","Atnaujinta":"Updated","Atnaujinti":"Refresh","Bandyti dar kartą":"Try again","Nepavyko gauti duomenų iš Google Sheets.":"Could not load data from Google Sheets.","Biudžetai":"Budgets","Biudžeto pokytis (€)":"Budget change (€)","Lankomumas":"Attendance","Žaidėjų algos":"Player salaries","Mokesčių skaičiuoklė":"Tax calculator","Klubas":"Club","Bendras biudžetas":"Total budget","Atlyginimų biudžetas":"Salary budget","Atlyginimų dalis":"Salary share","Biudžeto pokytis":"Budget change","Vieta lygoje":"League place","Europos turnyras":"European competition","Europa":"Europe","Šaltiniai":"Sources","Šaltinis":"Source","nuoroda":"link","Vid. lankomumas":"Avg. attendance","Užpildymas":"Filling rate","Profilis":"Profile","Žaidėjas / treneris":"Player / coach","Komanda":"Team","Šalis":"Country","Sezonas":"Season","sezonas":"season","Sutarties vertė":"Contract value","Trukmė":"Length","Mėnesio alga":"Monthly salary","Visos":"All","Ieškoti…":"Search…","Paieška":"Search","įrašų, iš jų pilnų duomenų:":"records, with complete data:","vidutinė atlyginimų dalis":"average salary share","(iš ":"(of ","Rodoma pirmos 300 eilučių – siaurinkite paieška ar filtru.":"Showing the first 300 rows – narrow down with search or filter.","Tušti langeliai rodomi „–“ ir į vidurkius neįtraukiami.":"Empty cells are shown as “–” and excluded from averages.","Nieko nerasta":"Nothing found","Uždaryti":"Close","← Atgal":"← Back","Lankomumas 2025/26":"Attendance 2025/26","Galima arenos talpa":"Available arena capacity","Tikėtinas lankomumas tokioje rinkoje (Europos kontekste)":"Expected attendance for such a market (European context)","Tikėtinas lankomumas savos lygos kontekste":"Expected attendance in own-league context","Lankomumo indeksas vs Europa":"Attendance index vs Europe","Lankomumo indeksas vs savo lyga":"Attendance index vs own league","Žaidėjai ir algos":"Players and salaries","Vardas":"Name","Rolė":"Role","Sp
