<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakdance</title>
<style>
  :root { --bg: #f2f2f0; --ink: #1b2233; --shadow: rgba(0,0,0,.28); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --ink: #e8eaf0; --shadow: rgba(0,0,0,.6); }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stage { text-align: center; perspective: 900px; }
  .dancer {
    position: relative; display: inline-block; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    background: none; border: 0; padding: 0;
  }
  .dancer:focus-visible { outline: 2px solid currentColor; outline-offset: 8px; }
  .jump  { display: block; transform-origin: 50% 100%; }
  .body  { display: block; transform-origin: 50% 50%; transform-style: preserve-3d; }
  .body img {
    display: block; height: min(62vh, 520px); width: auto;
    user-select: none; -webkit-user-drag: none;
  }
  .floor {
    width: 70%; height: 16px; margin: 6px auto 0; border-radius: 50%;
    background: radial-gradient(closest-side, var(--shadow), transparent);
  }
  .hint { margin-top: 18px; font-size: .95rem; opacity: .65; }

  /* Šuolis: pritūpia, išlekia, krenta */
  .dancing .jump  { animation: jump 3.4s cubic-bezier(.3,.1,.3,1) both; }
  /* Apsivertimas ir sukimasis aukštyn kojomis (headspin) */
  .dancing .body  { animation: spin 3.4s ease-in-out both; }
  .dancing .floor { animation: floor 3.4s ease-in-out both; }

  @keyframes jump {
    0%   { transform: translateY(0) scale(1, 1); }
    10%  { transform: translateY(0) scale(1.06, .9); }          /* pritūpimas */
    26%  { transform: translateY(-14%) scale(.98, 1.04); }      /* šuolis */
    36%  { transform: translateY(-2%) scale(1, 1); }            /* nusileidžia ant galvos */
    40%  { transform: translateY(0) scale(1.05, .95); }
    46%, 78% { transform: translateY(0) scale(1, 1); }
    52%  { transform: translateY(-3%); }
    60%  { transform: translateY(0); }
    68%  { transform: translateY(-3%); }
    78%  { transform: translateY(0); }
    88%  { transform: translateY(-12%); }                       /* atsistoja */
    96%  { transform: translateY(0) scale(1.05, .93); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes spin {
    0%   { transform: rotateZ(0) rotateY(0); }
    10%  { transform: rotateZ(0) rotateY(0); }
    26%  { transform: rotateZ(-110deg) rotateY(0); }
    38%  { transform: rotateZ(-180deg) rotateY(0); }            /* aukštyn kojom */
    80%  { transform: rotateZ(-180deg) rotateY(1800deg); }      /* 5 apsisukimai */
    88%  { transform: rotateZ(-250deg) rotateY(1800deg); }
    100% { transform: rotateZ(-360deg) rotateY(1800deg); }
  }
  @keyframes floor {
    0%, 10% { transform: scale(1); opacity: 1; }
    26%     { transform: scale(.6); opacity: .5; }
    40%     { transform: scale(1.1); opacity: 1; }
    80%     { transform: scale(1.1); opacity: 1; }
    88%     { transform: scale(.65); opacity: .5; }
    100%    { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dancing .jump, .dancing .body, .dancing .floor { animation-duration: .01s; }
  }
</style>
</head>
<body>
  <main class="stage">
    <button class="dancer" id="dancer" type="button" aria-label="Paspausk, kad pradėtų šokti">
      <span class="jump"><span class="body">
        <img src="breakdancer.png" alt="Vyras kostiumu su krepšinio kamuoliu" draggable="false">
      </span></span>
      <span class="floor" style="display:block"></span>
    </button>
    <p class="hint">Paspausk ant jo</p>
  </main>

<script>
  const el = document.getElementById('dancer');
  const stage = el.parentElement;
  const hint = stage.querySelector('.hint');
  let busy = false;

  el.addEventListener('click', () => {
    if (busy) return;
    busy = true;
    hint.style.visibility = 'hidden';
    el.classList.add('dancing');
  });

  // Animacijai pasibaigus – galima paspausti dar kartą
  el.querySelector('.body').addEventListener('animationend', () => {
    el.classList.remove('dancing');
    busy = false;
    hint.style.visibility = 'visible';
    hint.textContent = 'Dar kartą?';
  });
</script>
</body>
</html>
